name: Deploy to Vercel (Production)

# Runs on GitHub's own runners, not on any restricted sandbox — so it works
# regardless of the network policy of whatever environment authored the
# commit. Vercel's native GitHub App integration (if connected) still deploys
# independently of this; this workflow is a guaranteed, repo-native fallback
# that fires the same way every time.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token="$VERCEL_TOKEN" --yes
