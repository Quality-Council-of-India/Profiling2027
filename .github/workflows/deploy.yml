name: Deploy Profiling 2027 to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /opt/Profiling2027

            echo "======================================"
            echo "Fetching latest GitHub code"
            echo "======================================"

            git fetch origin main

            echo "======================================"
            echo "Updating backend and frontend only"
            echo "======================================"

            git checkout origin/main -- backend frontend

            echo "======================================"
            echo "Running Prisma migrations"
            echo "======================================"

            docker compose run --rm backend \
              npx prisma migrate deploy

            echo "======================================"
            echo "Building backend and frontend"
            echo "======================================"

            docker compose build backend frontend

            echo "======================================"
            echo "Restarting backend and frontend"
            echo "======================================"

            docker compose up -d backend frontend

            echo "======================================"
            echo "Container status"
            echo "======================================"

            docker ps

            echo "======================================"
            echo "Backend logs"
            echo "======================================"

            docker logs profiling2027-backend-1 --tail=30

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"