name: Deploy Profiling 2027 to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            APP_DIR="/opt/Profiling2027"
            BACKUP_DIR="/opt/Profiling2027-backups"
            TIMESTAMP=$(date +"%Y%m%d-%H%M%S")

            cd "$APP_DIR"

            echo "======================================"
            echo "PROFILING 2027 DEPLOYMENT STARTED"
            echo "======================================"

            CURRENT_COMMIT=$(git rev-parse HEAD)

            echo "Current EC2 commit:"
            echo "$CURRENT_COMMIT"

            # ==========================================
            # 1. Backup current application
            # ==========================================

            echo "Creating backup..."

            mkdir -p "$BACKUP_DIR"

            tar -czf \
              "$BACKUP_DIR/Profiling2027-$TIMESTAMP.tar.gz" \
              backend \
              frontend \
              docker-compose.yml \
              deploy/nginx/nginx.conf

            echo "$CURRENT_COMMIT" \
              > "$BACKUP_DIR/previous-commit-$TIMESTAMP.txt"

            # ==========================================
            # 2. Fetch latest GitHub code
            # ==========================================

            echo "Fetching latest GitHub code..."

            git fetch origin main

            NEW_COMMIT=$(git rev-parse origin/main)

            echo "GitHub commit:"
            echo "$NEW_COMMIT"

            # ==========================================
            # 3. Update application code ONLY
            #
            # Do NOT overwrite:
            # docker-compose.yml
            # deploy/nginx/nginx.conf
            #
            # These contain production configuration.
            # ==========================================

            echo "Updating backend and frontend..."

            git checkout origin/main -- backend frontend

            # ==========================================
            # 4. Build backend
            # ==========================================

            echo "Building backend..."

            docker compose build backend

            # ==========================================
            # 5. Build frontend
            # ==========================================

            echo "Building frontend..."

            docker compose build frontend

            # ==========================================
            # 6. Check Prisma migration status
            # ==========================================

            echo "Checking Prisma migrations..."

            docker compose run --rm backend \
              npx prisma migrate status || true

            # ==========================================
            # 7. Apply Prisma migrations
            # ==========================================

            echo "Applying Prisma migrations..."

            docker compose run --rm backend \
              npx prisma migrate deploy

            echo "Prisma migration completed."

            # ==========================================
            # 8. Start application
            # ==========================================

            echo "Starting backend and frontend..."

            docker compose up -d backend frontend

            # ==========================================
            # 9. Wait
            # ==========================================

            echo "Waiting for containers..."

            sleep 15

            # ==========================================
            # 10. Check backend
            # ==========================================

            BACKEND_STATUS=$(docker inspect \
              -f '{{.State.Status}}' \
              profiling2027-backend-1 2>/dev/null || echo "missing")

            echo "Backend status: $BACKEND_STATUS"

            if [ "$BACKEND_STATUS" != "running" ]; then

              echo "======================================"
              echo "BACKEND FAILED"
              echo "======================================"

              docker logs profiling2027-backend-1 --tail=100 || true

              echo "Deployment failed."

              exit 1
            fi

            # ==========================================
            # 11. Check frontend
            # ==========================================

            FRONTEND_STATUS=$(docker inspect \
              -f '{{.State.Status}}' \
              profiling2027-frontend-1 2>/dev/null || echo "missing")

            echo "Frontend status: $FRONTEND_STATUS"

            if [ "$FRONTEND_STATUS" != "running" ]; then

              echo "======================================"
              echo "FRONTEND FAILED"
              echo "======================================"

              docker logs profiling2027-frontend-1 --tail=100 || true

              exit 1
            fi

            # ==========================================
            # 12. Final status
            # ==========================================

            echo "======================================"
            echo "CONTAINER STATUS"
            echo "======================================"

            docker compose ps

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo "Previous commit:"
            echo "$CURRENT_COMMIT"

            echo "Deployed commit:"
            echo "$NEW_COMMIT"

            echo "Deployment completed at:"
            date
