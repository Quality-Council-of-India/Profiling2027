# Root reverse proxy — Technical Spec §2.1.1 / §2.2.
# Terminates SSL, serves the frontend static bundle, and routes /api to the
# backend. Run `certbot --nginx` (see README "Deployment" section) once DNS
# for your domain points here; it will rewrite this file to add the 443
# server block and redirect. Until then, this HTTP-only config is enough for
# `docker compose up` to serve the app on port 80.

events {}

http {
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name profilingfeedback.qcin.org;

        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;

        server_name profilingfeedback.qcin.org;

        ssl_certificate /etc/letsencrypt/live/profilingfeedback.qcin.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/profilingfeedback.qcin.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
