# Root reverse proxy — Technical Spec §2.1.1 / §2.2.
# Terminates SSL, serves the frontend static bundle, and routes /api to the
# backend. Run `certbot --nginx` (see README "Deployment" section) once DNS
# for your domain points here; it will rewrite this file to add the 443
# server block and redirect. Until then, this HTTP-only config is enough for
# `docker compose up` to serve the app on port 80.

events {}

http {
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    server {
        listen 80;
        server_name feedback.qcin.org; # replace with your actual domain

        client_max_body_size 5m; # roster CSV uploads

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
